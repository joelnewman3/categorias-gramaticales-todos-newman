<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Categorías gramaticales — Sustantivo, Adjetivo, Verbo</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --highlight-bar: #fcd34d;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;
      --warn: #d97706;
      --warn-bg: #fffbeb;
      --warn-border: #fde68a;
      --error: #dc2626;
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 18px 14px 32px;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    header h1 {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    header p {
      font-size: 0.92rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .filter-btn {
      background: var(--card);
      border: 1.5px solid var(--border);
      color: var(--text);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .filter-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 10px;
      text-align: center;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
    }

    .stat-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.15;
    }

    .stat-sub {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .flashcard {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 24px 26px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.05);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .card-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
    }

    .badge {
      background: var(--primary-soft);
      color: var(--primary);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: #f1f5f9;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 11px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .icon-btn:hover {
      background: #e2e8f0;
    }

    .progress-wrap {
      width: 100%;
      height: 6px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-bar {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.25s ease;
    }

    .instruction-eyebrow {
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* Sentence Display */
    .sentence-box {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.75rem;
      font-weight: 400;
      color: var(--text);
      line-height: 1.65;
      padding: 12px 4px 22px;
    }

    /* Bold + yellow underline highlight matching the reference screenshot */
    .target-highlight {
      font-weight: 800;
      position: relative;
      display: inline-block;
      z-index: 1;
      padding: 0 2px;
    }

    .target-highlight::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 3px;
      height: 10px;
      background: var(--highlight-bar);
      z-index: -1;
      border-radius: 2px;
    }

    /* Interactive clickable words for Type B */
    .clickable-word {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.7rem;
      background: transparent;
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 2px 6px;
      margin: 2px 1px;
      color: var(--text);
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .clickable-word:hover {
      background: var(--primary-soft);
      border-color: #bfdbfe;
      color: var(--primary);
    }

    .clickable-word.selected-correct {
      background: var(--success-bg);
      border-color: var(--success);
      color: #14532d;
      font-weight: 800;
    }

    .clickable-word.selected-wrong {
      background: var(--error-bg);
      border-color: var(--error);
      color: #7f1d1d;
    }

    .question-prompt {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 14px;
    }

    .question-prompt span.cat-pill {
      background: #fef3c7;
      color: #92400e;
      padding: 2px 10px;
      border-radius: 8px;
      border: 1px solid #fde68a;
    }

    /* 3-button multiple choice grid matching screenshot */
    .choice-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .choice-btn {
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      padding: 15px 12px;
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }

    .choice-btn:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
    }

    .choice-btn.correct {
      background: var(--success-bg);
      border-color: var(--success);
      color: #15803d;
    }

    .choice-btn.incorrect {
      background: var(--error-bg);
      border-color: var(--error);
      color: #b91c1c;
    }

    .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #f1f5f9;
      color: var(--text);
      border: 1px solid #cbd5e1;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    .feedback {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      display: none;
    }

    .feedback.show {
      display: block;
    }

    .feedback.correct {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: #15803d;
    }

    .feedback.incorrect {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: #b91c1c;
    }

    .kbd-tip {
      text-align: center;
      margin-top: 14px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .choice-grid {
        grid-template-columns: 1fr;
      }
      .sentence-box, .clickable-word {
        font-size: 1.35rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Categorías gramaticales</h1>
      <p>Identifica sustantivos, adjetivos y verbos en contexto.</p>
    </header>

    <div class="filters" id="filterBar">
      <button class="filter-btn active" data-filter="all">Todas (60)</button>
      <button class="filter-btn" data-filter="identify_pos">Palabra en negrita (30)</button>
      <button class="filter-btn" data-filter="click_word">Haz clic en la palabra (30)</button>
      <button class="filter-btn" data-filter="Sustantivo">Sustantivos (20)</button>
      <button class="filter-btn" data-filter="Adjetivo">Adjetivos (20)</button>
      <button class="filter-btn" data-filter="Verbo">Verbos (20)</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Score on First Attempt</div>
        <div class="stat-value" id="statFirstPct">0%</div>
        <div class="stat-sub" id="statFirstSub">0 of 0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Completed</div>
        <div class="stat-value" id="statCompleted">0 / 60</div>
        <div class="stat-sub" id="statRemaining">60 remaining</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Current Streak</div>
        <div class="stat-value" id="statStreak">0</div>
        <div class="stat-sub" id="statBestStreak">Best: 0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Actual Score</div>
        <div class="stat-value" id="statActualPct">0%</div>
        <div class="stat-sub" id="statActualSub">0 of 0</div>
      </div>
    </div>

    <div class="flashcard">
      <div class="card-top">
        <div class="card-meta">
          <span id="cardCounter">Pregunta 1 de 60</span>
          <span class="badge" id="modeBadge">Palabra en negrita</span>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="shuffleBtn" title="Shuffle current deck">Shuffle</button>
          <button class="icon-btn" id="resetBtn" title="Reset progress and stats">Reset</button>
        </div>
      </div>

      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div id="cardBody"></div>

      <div class="controls">
        <button type="button" class="btn btn-secondary" id="prevBtn">← Anterior</button>
        <button type="button" class="btn btn-primary" id="nextBtn">Siguiente →</button>
      </div>

      <div class="feedback" id="feedbackBox"></div>
      <div class="kbd-tip">Tip: Press <strong>Enter</strong> or <strong>→</strong> after answering to move to the next question.</div>
    </div>
  </div>

    let currentFilter = "all";
    let deck = [...ALL_CARDS];
    let currentIndex = 0;

    // Per-card tracking: { attempted: boolean, firstTryCorrect: boolean, solved: boolean, wrongGuesses: [] }
    let cardState = {};
    let currentStreak = 0;
    let bestStreak = 0;

    const cardBody = document.getElementById("cardBody");
    const cardCounter = document.getElementById("cardCounter");
    const modeBadge = document.getElementById("modeBadge");
    const progressBar = document.getElementById("progressBar");
    const feedbackBox = document.getElementById("feedbackBox");

    function getFilteredCards(filter) {
      if (filter === "all") return [...ALL_CARDS];
      if (filter === "identify_pos" || filter === "click_word") {
        return ALL_CARDS.filter(c => c.type === filter);
      }
      return ALL_CARDS.filter(c => c.category === filter);
    }

    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\]/g, "\$&");
    }

    function cleanToken(token) {
      return token.replace(/^[¿¡.,;:!?()"«»]+|[.,;:!?()"«»]+$/g, "");
    }

    function renderCard() {
      const card = deck[currentIndex];
      if (!cardState[card.id]) {
        cardState[card.id] = { attempted: false, firstTryCorrect: false, solved: false, wrongGuesses: [] };
      }
      const state = cardState[card.id];

      cardCounter.textContent = `Pregunta ${currentIndex + 1} de ${deck.length}`;
      modeBadge.textContent = card.type === "identify_pos" ? "Palabra en negrita" : "Haz clic en la palabra";

      if (card.type === "identify_pos") {
        // Highlight targetWord inside sentence
        const regex = new RegExp(`(^|\s)(${escapeRegExp(card.targetWord)})([.,;:!?]?)(\s|$)`, "i");
        const formattedSentence = card.sentence.replace(
          regex,
          `$1<span class="target-highlight">$2</span>$3$4`
        );

        const options = ["Adjetivo", "Sustantivo", "Verbo"];
        const buttonsHtml = options.map(opt => {
          let cls = "choice-btn";
          if (state.solved && opt === card.category) cls += " correct";
          else if (state.wrongGuesses.includes(opt)) cls += " incorrect";
          return `<button type="button" class="${cls}" data-choice="${opt}">${opt}</button>`;
        }).join("");

        cardBody.innerHTML = `
          <div class="instruction-eyebrow">LEE LA ORACIÓN</div>
          <div class="sentence-box">${formattedSentence}</div>
          <div class="question-prompt">La palabra en negrita es un/una...</div>
          <div class="choice-grid" id="choiceGrid">${buttonsHtml}</div>
        `;

        document.getElementById("choiceGrid").addEventListener("click", (e) => {
          const btn = e.target.closest(".choice-btn");
          if (!btn) return;
          handleChoice(btn.dataset.choice);
        });
      } else {
        // Type B: Click the word in the sentence matching card.category
        const rawTokens = card.sentence.split(/\s+/);
        const tokensHtml = rawTokens.map((tok, idx) => {
          const stripped = cleanToken(tok);
          const punct = tok.slice(stripped.length);
          let cls = "clickable-word";
          if (state.solved && stripped.toLowerCase() === card.targetWord.toLowerCase()) {
            cls += " selected-correct";
          } else if (state.wrongGuesses.includes(idx)) {
            cls += " selected-wrong";
          }
          return `<button type="button" class="${cls}" data-idx="${idx}" data-word="${stripped}">${stripped}</button>${punct ? `<span>${punct}</span>` : ""}`;
        }).join(" ");

        cardBody.innerHTML = `
          <div class="instruction-eyebrow">HAZ CLIC EN LA PALABRA CORRECTA</div>
          <div class="question-prompt">Selecciona el <span class="cat-pill">${card.category.toLowerCase()}</span> en esta oración:</div>
          <div class="sentence-box" id="wordClickBox">${tokensHtml}</div>
        `;

        document.getElementById("wordClickBox").addEventListener("click", (e) => {
          const btn = e.target.closest(".clickable-word");
          if (!btn) return;
          handleWordClick(parseInt(btn.dataset.idx, 10), btn.dataset.word);
        });
      }

      if (state.solved) {
        showFeedback("correct", `¡Correcto! ${card.explanation}`);
      } else {
        hideFeedback();
      }

      updateStats();
    }

    function handleChoice(chosen) {
      const card = deck[currentIndex];
      const state = cardState[card.id];
      if (state.solved) return;

      const isFirstAttempt = !state.attempted;
      state.attempted = true;

      if (chosen === card.category) {
        state.solved = true;
        if (isFirstAttempt) {
          state.firstTryCorrect = true;
          currentStreak++;
          if (currentStreak > bestStreak) bestStreak = currentStreak;
        }
        renderCard();
      } else {
        currentStreak = 0;
        if (!state.wrongGuesses.includes(chosen)) {
          state.wrongGuesses.push(chosen);
        }
        renderCard();
        showFeedback("incorrect", `No exactamente. «${card.targetWord}» no es un ${chosen.toLowerCase()}. ¡Inténtalo de nuevo!`);
      }
    }

    function handleWordClick(idx, clickedWord) {
      const card = deck[currentIndex];
      const state = cardState[card.id];
      if (state.solved) return;

      const isFirstAttempt = !state.attempted;
      state.attempted = true;

      if (clickedWord.toLowerCase() === card.targetWord.toLowerCase()) {
        state.solved = true;
        if (isFirstAttempt) {
          state.firstTryCorrect = true;
          currentStreak++;
          if (currentStreak > bestStreak) bestStreak = currentStreak;
        }
        renderCard();
      } else {
        currentStreak = 0;
        if (!state.wrongGuesses.includes(idx)) {
          state.wrongGuesses.push(idx);
        }
        renderCard();
        showFeedback("incorrect", `«${clickedWord}» no es el ${card.category.toLowerCase()} de la oración. ¡Prueba otra palabra!`);
      }
    }

    function showFeedback(type, message) {
      feedbackBox.className = `feedback show ${type}`;
      feedbackBox.textContent = message;
    }

    function hideFeedback() {
      feedbackBox.className = "feedback";
      feedbackBox.textContent = "";
    }

    function goNext() {
      currentIndex = (currentIndex + 1) % deck.length;
      renderCard();
    }

    function goPrev() {
      currentIndex = (currentIndex - 1 + deck.length) % deck.length;
      renderCard();
    }

    function shuffleDeck() {
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      currentIndex = 0;
      renderCard();
    }

    function resetAll() {
      cardState = {};
      currentStreak = 0;
      bestStreak = 0;
      currentIndex = 0;
      renderCard();
    }

    function updateStats() {
      const idsInDeck = new Set(deck.map(c => c.id));
      let attemptedCount = 0;
      let firstTryCount = 0;
      let solvedCount = 0;

      idsInDeck.forEach(id => {
        const st = cardState[id];
        if (st && st.attempted) {
          attemptedCount++;
          if (st.firstTryCorrect) firstTryCount++;
          if (st.solved) solvedCount++;
        }
      });

      const firstPct = attemptedCount > 0 ? Math.round((firstTryCount / attemptedCount) * 100) : 0;
      const actualPct = attemptedCount > 0 ? Math.round((solvedCount / attemptedCount) * 100) : 0;

      document.getElementById("statFirstPct").textContent = `${firstPct}%`;
      document.getElementById("statFirstSub").textContent = `${firstTryCount} of ${attemptedCount}`;

      document.getElementById("statCompleted").textContent = `${solvedCount} / ${deck.length}`;
      document.getElementById("statRemaining").textContent = `${deck.length - solvedCount} remaining`;

      document.getElementById("statStreak").textContent = `${currentStreak}`;
      document.getElementById("statBestStreak").textContent = `Best: ${bestStreak}`;

      document.getElementById("statActualPct").textContent = `${actualPct}%`;
      document.getElementById("statActualSub").textContent = `${solvedCount} of ${attemptedCount}`;

      const pctDone = deck.length > 0 ? (solvedCount / deck.length) * 100 : 0;
      progressBar.style.width = `${pctDone}%`;
    }

    document.getElementById("filterBar").addEventListener("click", (e) => {
      const btn = e.target.closest(".filter-btn");
      if (!btn) return;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.filter;
      deck = getFilteredCards(currentFilter);
      currentIndex = 0;
      renderCard();
    });

    document.getElementById("nextBtn").addEventListener("click", goNext);
    document.getElementById("prevBtn").addEventListener("click", goPrev);
    document.getElementById("shuffleBtn").addEventListener("click", shuffleDeck);
    document.getElementById("resetBtn").addEventListener("click", resetAll);

    document.addEventListener("keydown", (e) => {
      const card = deck[currentIndex];
      const state = cardState[card.id];
      if ((e.key === "Enter" || e.key === "ArrowRight") && state && state.solved) {
        e.preventDefault();
        goNext();
      } else if (e.key === "ArrowLeft") {
        e.preventDefault();
        goPrev();
      }
    });

    renderCard();
  </script>
